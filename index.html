<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel = "stylesheet" href = "style.css">
</head>
<body>

    <h1 class = "h1 text-center mb-5 p-2">1ST POST CRUD FETCH PROMISE WOG </h1>
    <div class = "container-fluid">
        <div class = "row"> 
            <div class = "col-md-4">
                <form id = "postForm">
                    <div class = "card m-5">
                        <h3 class = "h3 text-center p-1">FILL POST DETAILS</h3>
                        <div class = "card-body">


                            <div class = "form-group mb-3">
                                <label for = "userId">User ID :</label>
                                <input type = "number" class = "form-control" id = "userId">
                            </div>

                            <div class = "form-group mb-3">
                                <label for = "title">Title :</label>
                                <input type = "text" class = "form-control" id = "title">
                            </div>

                            <div class = "form-group mb-5">
                                <label for = "body">Content :</label>
                                <textarea class = "form-control" id = "body" rows="3"></textarea>
                            </div>


                            <button type = "submit" class = "btn btn-primary" id = "submitBtn">Submit</button>
                            <button type = "button" class = "btn btn-success d-none" id = "updateBtn">Update</button>



                        </div>     
                        </div>
                    </div>
                </form>





                 <div class = "col-md-8">
                <div class = "card1 m-5">
                    <div class = "card-body p-0">
                        <h3 class = "h3 text-center p-1">POSTS LIST</h3>
                        <table class = "table table-bordered">
                            <thead>
                                <tr>
                                    <th>USER ID</th>
                                    <th>TITLE</th>
                                    <th>BODY</th>
                                    <th>EDIT</th>
                                    <th>DELETE</th>
                                </tr>
                            </thead>
                            <tbody id = "postList">
                               <!-- <tr>
                                   <td>5</td>
                                   <td>maha bharat</td>
                                   <td>the mahabharat is historical story of pandvas's</td>
                                   <td><button class="btn btn-sm btn-warning">Edit</button></td>
                                   <td><button class="btn btn-sm btn-danger">Delete</button></td>
                               </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>


            </div>  
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only"></span>
            </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src = "app.js"></script>
</body>
</html>
